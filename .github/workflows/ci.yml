# Integración continua: restauración, compilación, pruebas y auditoría NuGet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AAALogistics.slnx

      - name: Build (Release)
        run: dotnet build AAALogistics.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AAALogistics.slnx --configuration Release --no-build --verbosity normal

      - name: NuGet vulnerability list
        # Informativo: no bloquea el job si el listado falla o hay avisos conocidos.
        run: |
          dotnet restore AAALogistics.slnx --verbosity quiet
          dotnet list package --vulnerable --include-transitive || true
